[package]
name = "lol-performance-review"
version = "0.1.1"
edition = "2024"

[dependencies]
actix-files = "0.7.0"
actix-web = "4.15.0"
actix-web-lab = "0.27.0"
askama = "0.16.1"
cached = { version = "4.0.0", features = ["async", "redb_store", "proc_macro"] }
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "7.0.0-rc2"
derive_more = { version = "2.1.1", features = ["from"] }
dotenvy = "0.15.7"
duration-str = "0.21.0"
env_logger = "0.11.11"
governor = "0.10.4"
itertools = "0.15.0"
log = "0.4.34"
nonzero_ext = "0.3.0"
ordered-float = "5.5.0"
phf = "0.14.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = { version = "3.23.0", features = ["chrono", "json"] }
strum = { version = "0.28.0", features = ["derive"] }
test-case = "3.3.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1.19"

[build-dependencies]
cached = { version = "4.0.0", features = ["redb_store", "proc_macro"] }
derive_more = { version = "2.1.1", features = ["from"] }
itertools = "0.15.0"
phf = "0.14.0"
phf_codegen = "0.14.0"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
