[package]
name = "lol-performance-review"
version = "0.1.1"
edition = "2024"

[dependencies]
actix-files = "0.6.10"
actix-web = "4.13.0"
actix-web-lab = "0.26.0"
askama = "0.15.6"
cached = { version = "0.59.0", features = ["async", "disk_store", "proc_macro"] }
chrono = { version = "0.4.44", features = ["serde"] }
dashmap = "7.0.0-rc2"
derive_more = { version = "2.1.1", features = ["from"] }
dotenvy = "0.15.7"
duration-str = "0.21.0"
env_logger = "0.11.10"
governor = "0.10.4"
itertools = "0.14.0"
log = "0.4.29"
nonzero_ext = "0.3.0"
ordered-float = "5.3.0"
phf = "0.13.1"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_with = { version = "3.18.0", features = ["chrono", "json"] }
strum = { version = "0.28.0", features = ["derive"] }
test-case = "3.3.1"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1.18"

[build-dependencies]
cached = { version = "0.59.0", features = ["disk_store", "proc_macro"] }
derive_more = { version = "2.1.1", features = ["from"] }
itertools = "0.14.0"
phf = "0.13.1"
phf_codegen = "0.13.1"
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
